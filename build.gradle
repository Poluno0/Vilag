plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = '1.0.1'
group = 'ru.example.villagercontrol'
archivesBaseName = 'VillagerControl'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    runs {
        client { workingDirectory project.file('run') ; mods { villagercontrol { source sourceSets.main } } }
        server { workingDirectory project.file('run') ; mods { villagercontrol { source sourceSets.main } } }
    }
}
repositories { mavenCentral() }
dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.2.0' }

jar.finalizedBy('reobfJar')
